# GELAN-s (default): NMS-free dual head with direct ltrb regression (docs/design.md 4.6).
# Width 0.50, depth 0.33 scaling of the GELAN-C topology. See gelan-s-nms.yaml for the
# classic one-to-many DFL head evaluated with NMS.
name: gelan-s
nc: 80
backbone: { type: gelan, width: 0.50, depth: 0.33 }
neck: { type: gelan_pan, width: 0.50, depth: 0.33 }
head: { type: dual, reg_max: 0 }
