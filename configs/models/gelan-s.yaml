# GELAN-s: width 0.50, depth 0.33 scaling of the GELAN-C topology (docs/design.md 4.5, D6).
# Classic one-to-many head with DFL; swap head.type to "dual" and reg_max to 0
# for NMS-free, direct-regression training (available from phase 5).
name: gelan-s
nc: 80
backbone: { type: gelan, width: 0.50, depth: 0.33 }
neck: { type: gelan_pan, width: 0.50, depth: 0.33 }
head: { type: detect, reg_max: 16 }
