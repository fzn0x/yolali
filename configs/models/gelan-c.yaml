# GELAN-C: the exact topology of the official gelan-c.pt / yolov9-c-converted.pt (equivalence target).
# Classic one-to-many head with DFL; swap head.type to "dual" and reg_max to 0
# for NMS-free, direct-regression training (available from phase 5).
name: gelan-c
nc: 80
backbone: { type: gelan, width: 1.0, depth: 1.0 }
neck: { type: gelan_pan, width: 1.0, depth: 1.0 }
head: { type: detect, reg_max: 16 }
