# GELAN-m (default): NMS-free dual head with direct ltrb regression (docs/design.md 4.6).
# Width 0.75, depth 0.67 scaling of the GELAN-C topology. See gelan-m-nms.yaml for the
# classic one-to-many DFL head evaluated with NMS.
name: gelan-m
nc: 80
backbone: { type: gelan, width: 0.75, depth: 0.67 }
neck: { type: gelan_pan, width: 0.75, depth: 0.67 }
head: { type: dual, reg_max: 0 }
