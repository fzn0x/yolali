[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "yolali"
version = "0.0.1"
description = "A YOLO you can actually read: a clean-room, NMS-free, fully typed PyTorch object detector."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "yolali contributors" }]
keywords = ["object-detection", "yolo", "pytorch", "gelan", "nms-free", "dinov2", "onnx"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Typing :: Typed",
]
dependencies = [
  "torch>=2.4",
  "torchvision>=0.19",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "opencv-python-headless>=4.9",
  "pillow>=10.0",
]

[project.optional-dependencies]
vit = ["timm>=1.0.9", "huggingface_hub>=0.24"]
export = ["onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.1"]
tensorboard = ["tensorboard>=2.17"]
wandb = ["wandb>=0.17"]
coco = ["pycocotools>=2.0.7"]
all = ["yolali[vit,export,tensorboard,wandb,coco]"]

[project.urls]
Homepage = "https://github.com/fzn0x/yolali"
Documentation = "https://fzn0x.github.io/yolali"
Repository = "https://github.com/fzn0x/yolali"
Issues = "https://github.com/fzn0x/yolali/issues"
Changelog = "https://github.com/fzn0x/yolali/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "types-pyyaml>=6.0",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[tool.hatch.build.targets.wheel]
packages = ["src/yolali"]

[tool.hatch.build.targets.sdist]
include = ["src/yolali", "LICENSE", "NOTICE", "README.md", "CHANGELOG.md"]

# ---------------------------------------------------------------------------
# uv: pick the right torch wheel per platform for local development.
# Linux (CI) gets the small CPU wheel; Windows gets CUDA 12.8 wheels.
# These sources only affect `uv sync`; PyPI consumers get plain `torch`.
# ---------------------------------------------------------------------------
[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]
# Markdown code blocks keep hand-aligned shape comments; do not reflow them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "N",        # pep8-naming
  "D",        # pydocstyle
  "ANN",      # annotations
  "SIM",      # simplify
  "RUF",      # ruff-specific
  "PL",       # pylint subset
  "NPY",      # numpy
  "T20",      # no stray print() in the library
]
ignore = [
  "D105",     # magic method docstrings
  "D107",     # __init__ docstrings (documented at class level)
  "D203",     # one-blank-line-before-class (conflicts with D211)
  "D213",     # multi-line-summary-second-line (conflicts with D212)
  "PLR0913",  # too many arguments: configs are explicit on purpose
  "PLR2004",  # magic values: tensor dims like 4 and 2 are self-explanatory
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "PLR", "T20"]
"scripts/**" = ["T20", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
# torch ships partial stubs; these two make strict mode livable without
# silencing real errors. Every remaining `# type: ignore` must carry a reason.
reportUnknownMemberType = false
reportUnknownArgumentType = false

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: long-running tests (training smoke, large downloads)",
  "weights: needs official YOLOv9 checkpoints in ./weights",
  "gpu: needs a CUDA device",
]
filterwarnings = ["error::DeprecationWarning:yolali.*"]
