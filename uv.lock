[[package]]
name = "yolali"
version = "0.0.1"
source = { editable = "." }
dependencies = [
    { name = "numpy", version = "2.4.6", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.12'" },
    { name = "numpy", version = "2.5.4", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.12'" },
    { name = "opencv-python-headless" },
    { name = "pillow" },
    { name = "pyyaml" },
    { name = "torch", version = "2.11.0+cu128", source = { registry = "https://download.pytorch.org/whl/cu128" }, marker = "sys_platform == 'win32'" },
    { name = "torch", version = "2.14.1", source = { registry = "https://pypi.org/simple" }, marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
    { name = "torch", version = "2.14.1+cpu", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "sys_platform == 'linux'" },
    { name = "torchvision", version = "0.26.0+cu128", source = { registry = "https://download.pytorch.org/whl/cu128" }, marker = "sys_platform == 'win32'" },
    { name = "torchvision", version = "0.29.1", source = { registry = "https://pypi.org/simple" }, marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
    { name = "torchvision", version = "0.29.1+cpu", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "sys_platform == 'linux'" },
]

[package.optional-dependencies]
all = [
    { name = "huggingface-hub" },
    { name = "onnx" },
    { name = "onnxruntime" },
    { name = "onnxscript" },
    { name = "pycocotools" },
    { name = "tensorboard" },
    { name = "timm" },
    { name = "wandb" },
]
coco = [
    { name = "pycocotools" },
]
export = [
    { name = "onnx" },
    { name = "onnxruntime" },
    { name = "onnxscript" },
]
tensorboard = [
    { name = "tensorboard" },
]
vit = [
    { name = "huggingface-hub" },
    { name = "timm" },
]
wandb = [
    { name = "wandb" },
]

[package.dev-dependencies]
dev = [
    { name = "pyright" },
    { name = "pytest" },
    { name = "pytest-cov" },
    { name = "ruff" },
    { name = "types-pyyaml" },
]
docs = [
    { name = "mkdocs-material" },
    { name = "mkdocstrings", extra = ["python"] },
]

[package.metadata]
requires-dist = [
    { name = "huggingface-hub", marker = "extra == 'vit'", specifier = ">=0.24" },
    { name = "numpy", specifier = ">=1.26" },
    { name = "onnx", marker = "extra == 'export'", specifier = ">=1.16" },
    { name = "onnxruntime", marker = "extra == 'export'", specifier = ">=1.18" },
    { name = "onnxscript", marker = "extra == 'export'", specifier = ">=0.1" },
    { name = "opencv-python-headless", specifier = ">=4.9" },
    { name = "pillow", specifier = ">=10.0" },
    { name = "pycocotools", marker = "extra == 'coco'", specifier = ">=2.0.7" },
    { name = "pyyaml", specifier = ">=6.0" },
    { name = "tensorboard", marker = "extra == 'tensorboard'", specifier = ">=2.17" },
    { name = "timm", marker = "extra == 'vit'", specifier = ">=1.0.9" },
    { name = "torch", marker = "sys_platform != 'linux' and sys_platform != 'win32'", specifier = ">=2.4" },
    { name = "torch", marker = "sys_platform == 'linux'", specifier = ">=2.4", index = "https://download.pytorch.org/whl/cpu" },
    { name = "torch", marker = "sys_platform == 'win32'", specifier = ">=2.4", index = "https://download.pytorch.org/whl/cu128" },
    { name = "torchvision", marker = "sys_platform != 'linux' and sys_platform != 'win32'", specifier = ">=0.19" },
    { name = "torchvision", marker = "sys_platform == 'linux'", specifier = ">=0.19", index = "https://download.pytorch.org/whl/cpu" },
    { name = "torchvision", marker = "sys_platform == 'win32'", specifier = ">=0.19", index = "https://download.pytorch.org/whl/cu128" },
    { name = "wandb", marker = "extra == 'wandb'", specifier = ">=0.17" },
    { name = "yolali", extras = ["vit", "export", "tensorboard", "wandb", "coco"], marker = "extra == 'all'" },
]
provides-extras = ["vit", "export", "tensorboard", "wandb", "coco", "all"]

[package.metadata.requires-dev]
dev = [
    { name = "pyright", specifier = ">=1.1.380" },
    { name = "pytest", specifier = ">=8.3" },
    { name = "pytest-cov", specifier = ">=5.0" },
    { name = "ruff", specifier = ">=0.6" },
    { name = "types-pyyaml", specifier = ">=6.0" },
]
docs = [
    { name = "mkdocs-material", specifier = ">=9.5" },
    { name = "mkdocstrings", extras = ["python"], specifier = ">=0.26" },
]
